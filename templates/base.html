<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MediScan AI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="{{ url_for('main.index') }}">MediScan&nbsp;AI</a>
      <nav>
        <a href="{{ url_for('main.index') }}">Dashboard</a>
        <a href="{{ url_for('xray.xray') }}">Chest X-ray</a>
        <a href="{{ url_for('labs.labs') }}">Blood tests</a>
        <a href="{{ url_for('report.report') }}">PDF report</a>
        <a href="{{ url_for('summary.summary') }}">Summary</a>
        <a href="{{ url_for('main.about') }}">About</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
